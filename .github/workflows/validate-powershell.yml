name: Validate Windows PowerShell payload
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and verify manifest with Windows PowerShell 5.1
        shell: powershell
        run: ./TEST/Test-RepositoryPayload.ps1
      - name: Register tasks and verify StopExisting and disabled-task repair
        shell: powershell
        run: ./TEST/Test-ScheduledTaskRegistration.ps1
